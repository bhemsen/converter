name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: the path handling has Windows-specific
        # behaviour (drive-relative paths, case-insensitive collisions) and its
        # own tests, which skip themselves elsewhere.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
      # at different code, a SHA cannot.  Comments record the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # No ffmpeg needed: the suite tests the command lines we build and the
      # decisions around them, and stubs the subprocess call itself.
      - name: Test
        run: pytest
